[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openapi-mcp-bridge"
version = "0.2.0"
description = "Expose any OpenAPI/Swagger API as Model Context Protocol (MCP) tools over stdio."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sssdavid529" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "openapi",
    "swagger",
    "llm",
    "ai",
    "tools",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
openapi-mcp-bridge = "openapi_mcp_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/sssdavid529/openapi-mcp-bridge"
Repository = "https://github.com/sssdavid529/openapi-mcp-bridge"
Issues = "https://github.com/sssdavid529/openapi-mcp-bridge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openapi_mcp_bridge"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
