# Publishes to PyPI when a version tag (e.g. v0.1.0) is pushed.
#
# This workflow uses PyPI Trusted Publishing (OIDC):
#   https://docs.pypi.org/trusted-publishers/
# No API token/secret is required.
#
# It also attaches the built .whl and .tar.gz as assets on the
# GitHub Release page so users can download the package directly.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
      contents: write # upload assets to GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
